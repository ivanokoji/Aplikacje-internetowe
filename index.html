<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Client </title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="panel glass">
      <h1 class="title">Weather Pulse</h1>
      <p class="subtitle">Sprawdź aktualną pogodę i prognozę 5-dniową</p>

      <div class="search-row">
        <input id="cityInput" type="text" placeholder="Wpisz miasto, np. Gdańsk" />
        <button id="checkBtn" aria-label="Sprawdź pogodę">Pogoda</button>
      </div>

      <div id="status" class="status"></div>
    </section>

    <section class="results">
      <div id="currentBox" class="result-block"></div>
      <div id="forecastBox" class="result-block"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
